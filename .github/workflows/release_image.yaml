name: Release Image
on:
  release:
    types:
      - published # a release is published (as a pre-release): push :<tag>
      - released # it is promoted: move :latest to it
  workflow_dispatch:
    inputs:
      tag:
        description: Release to push the image of (e.g. v1.0.4)
        required: true
        type: string
      latest:
        description: Also move :latest to it
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GHCR_IMAGE: ghcr.io/secuwall-com/sxm-relay
      # The relay's signing key, defsec-relay's deploy/sxm-relay.pub.
      PUBKEY: RWSrRT9+hGKhX60PiyCHQn8XtSm/DmdFRVV+tAA9mpgpBfadx4L6c/3H
    steps:
      - name: Check the tag
        run: echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "tag should look like v1.0.1 (got $TAG)"; exit 1; }

      # The upstream build, checked against a pinned SHA-256 (the same pin as
      # defsec-relay's install-minisign action).
      - name: Install minisign
        env:
          VERSION: "0.12"
          SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/minisign"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/minisign.tar.gz" "https://github.com/jedisct1/minisign/releases/download/$VERSION/minisign-$VERSION-linux.tar.gz"
          echo "$SHA256  $dir/minisign.tar.gz" | sha256sum -c - >/dev/null
          tar -xzf "$dir/minisign.tar.gz" -C "$dir" minisign-linux/x86_64/minisign
          echo "$dir/minisign-linux/x86_64" >> "$GITHUB_PATH"

      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only image tarballs whose signature checks out reach the registry.
      - name: Push the image
        if: github.event_name == 'workflow_dispatch' || github.event.action == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern SHA256SUMS --pattern SHA256SUMS.minisig --pattern 'sxm-relay-image-linux-*.tar'
          cd release
          minisign -Vm SHA256SUMS -P "$PUBKEY"
          sha256sum -c SHA256SUMS --ignore-missing
          for arch in amd64 arm64; do
            # Both tarballs tag their image sxm-relay:$TAG, so retag each as it loads.
            docker load -q -i "sxm-relay-image-linux-$arch.tar" >/dev/null
            docker tag "sxm-relay:$TAG" "$GHCR_IMAGE:$TAG-$arch"
            docker push -q "$GHCR_IMAGE:$TAG-$arch"
          done
          docker buildx imagetools create -t "$GHCR_IMAGE:$TAG" "$GHCR_IMAGE:$TAG-amd64" "$GHCR_IMAGE:$TAG-arm64"

      - name: Make the image the latest
        if: github.event.action == 'released' || inputs.latest
        run: docker buildx imagetools create -t "$GHCR_IMAGE:latest" "$GHCR_IMAGE:$TAG"
